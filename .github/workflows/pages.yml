name: Deploy to GitHub Pages

# The site root is always the game on main. Branches in PREVIEWS are built
# next to it, each in its own folder (<site>/<folder>/), so changes can be
# played before they go to main. A preview keeps its own save (VITE_PREVIEW).
#
# Only main may deploy to Pages. So a push to the preview branch runs
# "Preview checks" (preview.yml), and when those pass, this workflow runs
# from main and deploys both.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Space-separated <folder>=<branch> pairs.
  PREVIEWS: preview=preview

jobs:
  build:
    # After a preview push, deploy only when its checks passed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build previews
        run: |
          for entry in $PREVIEWS; do
            folder="${entry%%=*}"
            branch="${entry#*=}"
            if ! git fetch --depth 1 origin "$branch"; then
              echo "::warning::Preview branch $branch not found, skipping $folder/"
              continue
            fi
            git worktree add --detach "$RUNNER_TEMP/preview-$folder" FETCH_HEAD
            (
              cd "$RUNNER_TEMP/preview-$folder"
              npm ci
              npm test
              VITE_PREVIEW="$folder" npm run build
            )
            mkdir -p "dist/$folder"
            cp -r "$RUNNER_TEMP/preview-$folder/dist/." "dist/$folder/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
