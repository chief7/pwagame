<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pwagame" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pwagame</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div id="needs" class="needs"></div>
        <div class="status">
          <span id="clock"></span>
          <span id="shelter"></span>
        </div>
      </header>
      <canvas id="view"></canvas>
      <button id="btn-grill" type="button" hidden><img alt="" /><span class="count"></span></button>
      <footer>
        <ul id="log" aria-live="polite"></ul>
        <div id="actions">
          <button id="btn-bag" type="button" data-t="bag">Bag</button>
          <button id="btn-build" type="button" data-t="build">Build</button>
          <button id="btn-skills" type="button"><span data-t="skills">Skills</span></button>
          <button id="btn-map" type="button" hidden><img alt="" /><span data-t="map">Map</span></button>
          <button id="btn-sleep" type="button" data-t="sleep">Sleep</button>
        </div>
      </footer>
      <div id="sheet" class="sheet" hidden>
        <div class="sheet-panel" role="dialog" aria-labelledby="sheet-title">
          <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <button id="sheet-close" type="button" data-t="close">Close</button>
          </div>
          <div id="sheet-body"></div>
        </div>
      </div>
      <div id="picker" class="overlay">
        <div class="panel">
          <h1 data-t="chooseExplorer">Choose your explorer</h1>
          <div class="choices">
            <button type="button" data-body="female"><canvas width="96" height="96"></canvas><span data-t="female">Female</span></button>
            <button type="button" data-body="male"><canvas width="96" height="96"></canvas><span data-t="male">Male</span></button>
          </div>
          <button id="picker-lang" class="lang-switch" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
